# Automated releases: merge PRs to main, nothing else.
#
# 1. Every push to main runs release-please, which keeps one open "release: vX.Y.Z"
#    PR up to date: it bumps all four npm workspaces, their exact internal pins,
#    package-lock.json and sdk/python/pyproject.toml in lockstep, and writes
#    CHANGELOG.md from the conventional-commit PR titles since the last release
#    (config: release-please-config.json).
# 2. Merging that PR makes release-please tag vX.Y.Z and create the GitHub release.
#    The jobs below then publish in this same run: npm (provenance), PyPI, the
#    macOS VZ helper and the arm64 guest tarball.
#
# The publish jobs live here, not in a tag-triggered workflow, because a tag
# pushed with GITHUB_TOKEN never starts another workflow. This file also has to
# stay named release.yml: the npm and PyPI trusted publishers are bound to it.
#
# Trusted publishing means npm and PyPI get no stored token. Both publish over
# GitHub OIDC, and every npm package gets provenance attestations. Prerequisite
# (once per package, AFTER its first manual publish): on npmjs.com, package →
# Settings → Publishing access → add Trusted Publisher:
#   GitHub repo `directionally-local/hotcell`, workflow `release.yml`.
#
# Manual fallback: pushing a v* tag (or running this workflow on a tag) still
# publishes that tag without going through release-please.
name: release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

# Merges that land close together queue up instead of racing on the release PR.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # tags + GitHub releases
      pull-requests: write # the release PR
      issues: write # labels on the release PR
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Decides whether this run publishes, and what tag. On main: only when
  # release-please just cut a release. On a tag push (manual fallback): that tag.
  plan:
    needs: release-please
    if: always() && (needs.release-please.result == 'success' || needs.release-please.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      publish: ${{ steps.p.outputs.publish }}
      tag: ${{ steps.p.outputs.tag }}
    steps:
      - id: p
        env:
          RELEASED: ${{ needs.release-please.outputs.release_created }}
          RP_TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"; echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          elif [ "$RELEASED" = "true" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"; echo "tag=$RP_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

  # PyPI trusted publishing (OIDC). Prerequisite (once): pypi.org → Account →
  # Publishing → "Add a pending publisher" → project `hotcell`, owner
  # `directionally-local`, repo `hotcell`, workflow `release.yml`, environment blank.
  pypi:
    needs: plan
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.tag }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build && python -m build sdk/python -o dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true # re-triggered tags shouldn't fail on an already-uploaded version

  publish:
    needs: plan
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # OIDC for npm trusted publishing + provenance
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          check-latest: true
          registry-url: https://registry.npmjs.org
      - uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
      # OIDC trusted publishing needs npm >= 11.5; node 22 bundles npm 10.
      - run: npm install -g npm@latest
      # Guard against v0.1.21's failure mode: versions bumped but the exact
      # internal pins (cli -> daemon/sdk, mastra -> sdk) left one release behind.
      - name: lockstep version check
        env:
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
        run: node scripts/check-release-versions.mjs
      - run: npm ci
      - run: npm run build:agent
      - run: npm run build
      - name: publish (dependency order, provenance)
        run: |
          npm publish -w @hotcell/sdk --access public --provenance
          npm publish -w @hotcell/daemon --access public --provenance
          npm publish -w hotcell --provenance
          npm publish -w @hotcell/mastra --access public --provenance

  # Build the ad-hoc code-signed Apple VZ helper on a macOS/arm64 runner and
  # attach it to the GitHub release, so `npm i -g hotcell` on an Apple-Silicon Mac
  # fetches it on first use (driver/vz-fetch.ts). Ad-hoc signing carries the
  # virtualization entitlement and needs no Apple Developer account. Independent of
  # the npm/PyPI jobs — a helper build failure never blocks package publishing.
  helper-macos:
    needs: plan
    if: needs.plan.outputs.publish == 'true'
    runs-on: macos-14
    timeout-minutes: 20
    permissions:
      contents: write # create the release + upload assets
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          check-latest: true
      - name: build + ad-hoc-sign the VZ helper
        run: npm run build:vz
      - name: checksum
        run: cd helpers/hotcell-vz/dist && shasum -a 256 hotcell-vz > hotcell-vz.sha256
      - name: attach to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.plan.outputs.tag }}
          files: |
            helpers/hotcell-vz/dist/hotcell-vz
            helpers/hotcell-vz/dist/hotcell-vz.sha256

  # Build the guest runtime (kernel + in-guest agent) on a native arm64 Linux
  # runner and attach it — with the converter scripts — as one tarball the daemon
  # fetches on first `hotcell run` (driver/vz-fetch.ts fetchVzGuest). The kernel is
  # a ~15-30 min compile in an arm64 Docker container (build-kernel.sh). Independent
  # of the npm/PyPI jobs — a guest build failure never blocks package publishing.
  guest-arm64:
    needs: plan
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.tag }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
      - name: build guest kernel (arm64) + in-guest agent
        run: |
          bash helpers/hotcell-vz/build-kernel.sh
          (cd agent && CGO_ENABLED=0 GOOS=linux GOARCH=arm64 \
            go build -o ../helpers/hotcell-vz/guest/hotcell-agent ./cmd/hotcell-agent)
      - name: assemble + checksum the guest tarball
        run: |
          cd helpers/hotcell-vz
          tar czf hotcell-vz-guest-arm64.tar.gz \
            convert-image.sh build-blank-workspace.sh \
            guest/init.sh guest/hotcell-agent guest/vmlinux-vz
          shasum -a 256 hotcell-vz-guest-arm64.tar.gz > hotcell-vz-guest-arm64.tar.gz.sha256
      - name: attach to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.plan.outputs.tag }}
          files: |
            helpers/hotcell-vz/hotcell-vz-guest-arm64.tar.gz
            helpers/hotcell-vz/hotcell-vz-guest-arm64.tar.gz.sha256
